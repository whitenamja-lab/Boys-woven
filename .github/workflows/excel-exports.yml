name: Build catalog Excel exports
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
permissions:
  contents: write
concurrency:
  group: catalog-excel-exports
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl Pillow
      - run: python scripts/build_excel_exports.py
      - run: |
          git add -- exports index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish catalog Excel exports'
          git push
