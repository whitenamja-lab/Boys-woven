
name: Create New Department Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: add-four-departments

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create department pages
        run: python scripts/create_new_departments.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/dept-46/ \
                  reports/dept-18/ \
                  reports/dept-38/ \
                  reports/dept-328/

          if ! git diff --cached --quiet; then
            git commit -m "Add four new department pages"
            git push origin HEAD:add-four-departments
          fi
