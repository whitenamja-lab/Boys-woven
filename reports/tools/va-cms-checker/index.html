function records(rows,required){let i=rows.findIndex(r=>required.every(k=>r.map(norm).includes(k)));if(i<0)throw Error('필수 컬럼 없음: '+required.join(', '));let h=Array.from(rows[i],norm);return rows.slice(i+1).map(r=>Object.fromEntries(h.map((k,j)=>[k,r[j]??''])))}

function date(v){let s=clean(v);if(!s)return '';if(/^\d+(\.\d+)?$/.test(s))return new Date(Date.UTC(1899,11,30)+Number(s)*86400000).toISOString().slice(0,10);return s.slice(0,10)}
let sheets=[];function add(name,headers,rows,bad=[]){sheets.push({name,headers,rows,bad});let sec=document.createElement('section'),h=document.createElement('h2');h.textContent=name;sec.append(h);let wrap=document.createElement('div');wrap.className='scroll';let table=document.createElement('table'),tr=table.insertRow();headers.forEach(v=>{let th=document.createElement('th');th.textContent=v;tr.append(th)});rows.forEach((r,i)=>{let tr=table.insertRow();r.forEach((v,j)=>{let c=tr.insertCell();c.textContent=v??'—';if(bad[i]?.includes(j))c.className='bad'})});wrap.append(table);sec.append(wrap);$('results').append(sec)}
function compare(V,C,sourceMap=new Map(),excluded=new Set()){let vr=Object.values(V).find(r=>r.some(x=>x.map(norm).includes('SUGGESTED UNIT RETAIL'))),cr=tab(C,'MODERN COMMIT ITEM DETAILS');if(!vr||!cr)throw Error('VA 또는 CMS Item Details 탭을 찾을 수 없습니다.');let v=records(vr,['DPCI','SUGGESTED UNIT RETAIL','FCA FACTORY CITY UNIT COST','ENT TTL RCPT U']).filter(r=>key(r.DPCI)),c=records(cr,['DPCI','RETAIL','COMMIT UNITS','SIZE']).filter(r=>key(r.DPCI));if(!v.length)throw Error('유효한 VA DPCI 없음');let vm=new Map(),cm=new Map();for(let [rs,m] of [[v,vm],[c,cm]])for(let r of rs){let k=key(r.DPCI);if(m.has(k))throw Error('중복 DPCI: '+k+' — 중복 행을 확인하세요.');m.set(k,r)}let rows=[],bad=[],vq=0,cq=0,matched=0,changes=0,missing=0;for(let [k,r] of cm){let a=vm.get(k),q=num(r['COMMIT UNITS']),p=num(a?.['ENT TTL RCPT U']),ret=num(a?.['SUGGESTED UNIT RETAIL']),ret2=num(r.RETAIL),f=num(a?.['FCA FACTORY CITY UNIT COST']),f2=num(r.COST??r.CST),sz=clean(a?.['PRODUCT DESCRIPTION']).match(/(?:\b\d+\s*(?:Months?|M|T)|\b(?:XXS|XS|S|M|L|XL|XXL))$/i)?.[0]??'',d=[diff(ret,ret2),diff(f,f2),diff(p,q),diff(num(a?.['CASE UNIT QUANTITY']),num(r.VCP)),diff(num(a?.['INNER PACK UNIT QUANTITY']),num(r.SSP))],sc=sz&&size(r.SIZE)?size(sz)===size(r.SIZE):null;let flags=[];d.forEach((x,i)=>{if(x===null||x!==0)flags.push(['RETAIL','COST','QTY','VCP','SSP'][i])});if(sc!==true)flags.push('SIZE');let status=!a?'CMS ONLY':flags.length?'CHECK: '+flags.join(', '):'MATCH';if(a){matched++;if(flags.length)changes++;if(p===null||q===null)missing++;else{vq+=p;cq+=q}}let row=[k,r['VENDOR STYLE'],r['GMS COLOR'],sz,r.SIZE,ret,ret2,d[0],f,f2,d[1],r['COST TYPE'],p,q,d[2],num(a?.['CASE UNIT QUANTITY']),num(r.VCP),d[3],num(a?.['INNER PACK UNIT QUANTITY']),num(r.SSP),d[4],status];row.push(sourceMap.get(k)||'');rows.push(row);bad.push([...(sc!==true?[3,4]:[]),...d.flatMap((x,i)=>x===null||x!==0?[[7,10,14,17,20][i]]:[]),...(status!=='MATCH'?[21]:[])])}add('Summary',['Metric','Value'],[['VA DPCI',vm.size],['CMS DPCI',cm.size],['Matched function pack(rs,required){const h=[...new Set([...required,...rs.flatMap(r=>Object.keys(r))])];return [h,...rs.map(r=>h.map(k=>r[k]??''))]}
function mergeCMS(inputs){

function exportXlsx(){let ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main',rn='http://schemas.openxmlformats.org/officeDocument/2006/relationships',pn='http://schemas.openxmlformats.org/package/2006/relationships',files={};files['[Content_Types].xml']=`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;files['_rels/.rels']=`<Relationships xmlns="${pn}"><Relationship Id="rId1" Type="${rn}/officeDocument" Target="xl/workbook.xml"/></Relationships>`;files['xl/workbook.xml']=`<workbook xmlns="${ns}" xmlns:r="${rn}"><sheets>${sheets.map((s,i)=>`<sheet name="${esc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`;files['xl/_rels/workbook.xml.rels']=`<Relationships xmlns="${pn}">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${rn}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="styles" Type="${rn}/styles" Target="styles.xml"/></Relationships>`;files['xl/styles.xml']=`<styleSheet xmlns="${ns}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF234B68"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"
